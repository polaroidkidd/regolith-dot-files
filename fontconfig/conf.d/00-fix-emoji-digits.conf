<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Prevent color emoji fonts from providing glyphs for Basic Latin characters
    (digits 0-9, letters, punctuation). Without this, emoji fonts that contain
    wide emoji-style digit glyphs cause numbers to render with huge spacing.
  -->
  <match target="scan">
    <test name="family" compare="contains">
      <string>Color Emoji</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <!-- Basic Latin: digits, letters, punctuation -->
          <range>
            <int>0x0020</int>
            <int>0x007E</int>
          </range>
          <!-- General Punctuation -->
          <range>
            <int>0x2000</int>
            <int>0x206F</int>
          </range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
