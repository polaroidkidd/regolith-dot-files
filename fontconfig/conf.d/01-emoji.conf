<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Keep emoji available as a fallback, after ordinary text fonts. -->
  <alias>
    <family>serif</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
  <alias>
    <family>monospace</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
</fontconfig>
